name: Generate Contribution Snake

# Generates an animated SVG of a snake eating the contribution graph
# and publishes it to the `output` branch, which README.md references.

on:
  schedule:
    # Refresh twice a day so the snake stays current with new contributions
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23a78bfa&color_dots=%23161b22,%23164e63,%230891b2,%2306b6d4,%2322d3ee

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
